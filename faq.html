<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="関西新生活サポートのよくある質問。利用料・対応エリア・学生利用などについてお答えします。">
<title>よくある質問 | 関西新生活サポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1A6FD4;
    --blue-light: #E8F2FC;
    --blue-dark: #1558A8;
    --green: #1DB87A;
    --green-light: #E6F7F0;
    --green-dark: #0F8A5A;
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --text: #1A202C;
    --muted: #64748B;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo-mark {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--green) 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg { width: 20px; height: 20px; fill: white; }
  .logo-text { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .logo-text span { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }

  /* ── HERO ── */
  .hero {
    background: var(--surface);
    padding: 40px 20px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .hero-badge {
    display: inline-block;
    background: var(--blue-light);
    color: var(--blue);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
    letter-spacing: 0.03em;
  }
  .hero h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .hero p {
    font-size: 13px;
    color: var(--muted);
  }

  /* ── MAIN ── */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 0 24px;
  }

  /* ── FAQ ITEM ── */
  .faq-list {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .faq-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .faq-q {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
  }
  .faq-q .badge {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .faq-a {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 0 16px 16px;
    font-size: 14px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: -1px;
    padding-top: 14px;
  }
  .faq-a .badge {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--blue-light);
    color: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  /* ── CTA SECTION ── */
  .cta-section {
    margin: 8px 16px 0;
    padding: 24px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    text-align: center;
  }
  .cta-section h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .cta-section p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .btn-group {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-line {
    display: flex;
    width: 100%;
    padding: 18px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-line:active { transform: scale(0.98); background: var(--green-dark); }

  .btn-secondary {
    display: flex;
    width: 100%;
    padding: 16px;
    background: var(--blue-light);
    color: var(--blue);
    border: none;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-secondary:active { transform: scale(0.98); background: #D6E8FA; }

  .bottom-spacer { height: 24px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 8v14h8v-6h4v6h8V8L12 2z"/></svg>
  </div>
  <div class="logo-text">
    関西新生活サポート
    <span>住まいから始まる、新生活サポート。</span>
  </div>
</header>

<div class="hero">
  <div class="hero-badge">✦ よくあるご質問</div>
  <h1>よくある質問</h1>
  <p>サービスについて、よくいただくご質問にお答えします</p>
</div>

<main>
  <div class="faq-list">

    <div class="faq-item">
      <div class="faq-q"><span class="badge">Q</span>利用料はかかりますか？</div>
      <div class="faq-a"><span class="badge">A</span>完全無料です。</div>
    </div>

    <div class="faq-item">
      <div class="faq-q"><span class="badge">Q</span>対応エリアは？</div>
      <div class="faq-a"><span class="badge">A</span>大阪・京都・兵庫・奈良です。</div>
    </div>

    <div class="faq-item">
      <div class="faq-q"><span class="badge">Q</span>学生でも利用できますか？</div>
      <div class="faq-a"><span class="badge">A</span>ご利用可能です。</div>
    </div>

    <div class="faq-item">
      <div class="faq-q"><span class="badge">Q</span>初期費用を抑えたいです。</div>
      <div class="faq-a"><span class="badge">A</span>ご希望に合わせてご提案可能です。</div>
    </div>

    <div class="faq-item">
      <div class="faq-q"><span class="badge">Q</span>オンライン相談は可能ですか？</div>
      <div class="faq-a"><span class="badge">A</span>LINEや電話で対応可能です。</div>
    </div>

  </div>

  <div class="cta-section">
    <h2>ほかにもご不明な点があれば</h2>
    <p>担当スタッフが直接お答えします。<br>お気軽にご相談ください。</p>
  </div>

  <div class="btn-group">
    <a href="https://lin.ee/WXRhuH1" class="btn-line" target="_blank" rel="noopener noreferrer" aria-label="LINEで無料相談する">
      <svg width="24" height="24" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="40" height="40" rx="10" fill="white"/>
        <path d="M20 7C12.82 7 7 12.06 7 18.31c0 5.61 4.98 10.32 11.7 11.19.46.1 1.08.3 1.24.7.14.35.09.91.04 1.26 0 0-.16 1-.2 1.21-.06.35-.28 1.38 1.21.75 1.49-.63 8.05-4.74 10.98-8.12C33.88 22.62 33 20.56 33 18.31 33 12.06 27.18 7 20 7z" fill="#06C755"/>
        <path d="M28.03 22.07h-4.2a.3.3 0 01-.3-.3v-6.5c0-.17.13-.3.3-.3h4.2c.16 0 .3.13.3.3v1.06c0 .17-.14.3-.3.3h-2.83v1.12h2.83c.16 0 .3.13.3.3v1.06c0 .17-.14.3-.3.3h-2.83v1.12h2.83c.16 0 .3.13.3.3v1.06c0 .17-.14.3-.3.3zm-5.88 0h-1.06a.3.3 0 01-.3-.3v-6.5c0-.17.13-.3.3-.3h1.06c.17 0 .3.13.3.3v6.5c0 .16-.13.3-.3.3zm-2.12 0h-4.2a.3.3 0 01-.3-.3v-6.5c0-.17.13-.3.3-.3h1.06c.17 0 .3.13.3.3v5.14h2.84c.16 0 .3.13.3.3v1.06c0 .17-.14.3-.3.3zm-5.88-6.8h-1.06a.3.3 0 00-.3.3v6.5c0 .16.13.3.3.3h1.06c.17 0 .3-.14.3-.3v-6.5c0-.17-.13-.3-.3-.3z" fill="white"/>
      </svg>
      無料相談する
    </a>
    <a href="https://keita781425-art.github.io/kansai-support/" class="btn-secondary">
      ← エリア診断へ戻る
    </a>
  </div>

  <div class="bottom-spacer"></div>
</main>

</body>
</html>
