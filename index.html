<!DOCTYPE html>
<!--
  index.html
  ════════════════════════════════════════════════════════════
  Next.js移行時の対応表:
    <head>内のCSS/フォント  → app/layout.tsx の <head> / next/font
    <div id="app-header">   → components/Header/Header.tsx
    <div id="app-hero">     → components/Hero/Hero.tsx
    <div id="app-main">     → 各ページのメインコンテンツ領域
    <script> タグ群        → 各 .tsx ファイルに分散
  ════════════════════════════════════════════════════════════
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="関西で新生活を始める方向け、無料エリア診断サービス。希望条件を入力するだけでおすすめエリアを3つ提案します。">
  <title>関西新生活サポート | 住まいから始まる、新生活サポート。</title>

  <!-- Fonts: Next.js移行時は next/font/google に置き換え -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Styles: Next.js移行時は app/globals.css として import -->
    <!-- Styles -->
  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>

  <div id="app-root">

    <div id="app-header"></div>

    <div id="app-hero"></div>

    <main id="app-main" role="main"></main>

  </div>

  <!-- JavaScript -->
  <script src="areaData.js"></script>
  <script src="formConfig.js"></script>
  <script src="diagnose.js"></script>
  <script src="validate.js"></script>
  <script src="gasClient.js"></script>
  <script src="index.js"></script>
  <script src="app.js"></script>

</body>
</html>
