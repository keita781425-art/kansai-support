<!DOCTYPE html>
<!--
  index.html
  ════════════════════════════════════════════════════════════
  Next.js移行時の対応表:
    <head>内のCSS/フォント  → app/layout.tsx の <head> / next/font
    <div id="app-header">   → components/Header/Header.tsx
    <div id="app-hero">     → components/Hero/Hero.tsx
    <div id="app-main">     → 各ページのメインコンテンツ領域
    <script> タグ群        → 各 .tsx ファイルに分散
  ════════════════════════════════════════════════════════════
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="関西で新生活を始める方向け、無料エリア診断サービス。希望条件を入力するだけでおすすめエリアを3つ提案します。">
  <title>関西新生活サポート | 住まいから始まる、新生活サポート。</title>

  <!-- Fonts: Next.js移行時は next/font/google に置き換え -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Styles: Next.js移行時は app/globals.css として import -->
  <link rel="stylesheet" href="styles/globals.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!--
    アプリのルートDOM構造
    Next.js移行時: app/layout.tsx の <body> 内
  -->
  <div id="app-root">

    <!-- Header: components/Header/Header.tsx -->
    <div id="app-header"></div>

    <!-- Hero + StepIndicator: components/Hero/Hero.tsx -->
    <div id="app-hero"></div>

    <!-- Main content: 各ページで切り替わる領域 -->
    <main id="app-main" role="main"></main>

  </div>

  <!--
    Scripts
    ロード順序は依存関係の順番通り:
      1. lib/   (ピュア関数・データ。UIに依存しない)
      2. components/ (描画関数。libに依存)
      3. pages/ (アプリ制御。libとcomponentsに依存)

    Next.js移行時:
      - lib/*.js       → lib/*.ts (export functionに変換)
      - components/*.js → components/*/*.tsx (JSX/Reactに変換)
      - pages/app.js   → app/page.tsx + useReducer
  -->

  <!-- lib: ピュア関数・設定・データ -->
  <script src="lib/areaData.js"></script>
  <script src="lib/formConfig.js"></script>
  <script src="lib/diagnose.js"></script>
  <script src="lib/validate.js"></script>
  <script src="lib/gasClient.js"></script>

  <!-- components: UI描画関数 -->
  <script src="components/index.js"></script>

  <!-- pages: アプリ制御・ルーティング -->
  <script src="pages/app.js"></script>

</body>
</html>
